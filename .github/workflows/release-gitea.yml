# Cut the release `afkd install @afkd/gitea` fetches.
#
# afkd resolves a bare plugin name through https://afkd.sh/plugins.json, which lists
# `@afkd/gitea` at this repository's `releases/download/gitea/afkd-gitea.tar.gz`. afkd cannot
# install a subdirectory of a monorepo — its git leg requires the manifest at the clone root,
# and its tarball leg steps through exactly one wrapper directory — so the installable
# artifact is this per-plugin tarball, whose single top-level directory is the plugin itself.
# It ships source, not a binary: the manifest's `build` compiles it on the operator's host.
#
# The tag is FIXED and moves onto each new release on purpose: `afkd update` re-fetches the
# source URL it recorded at install time and never re-reads the index, so one unchanging
# address is the only way an already-installed operator reaches the next version.
name: Release @afkd/gitea

on:
  push:
    branches: [main]
    paths: ['@afkd/gitea/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-gitea
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A red suite must not publish, so the plugin's own suite — its unit tests and the wire
      # contract suite against the loopback fake Gitea — runs here, `--locked` as afkd's own
      # install builds it. The drift gate under `drift/` needs an afkd on PATH, so it runs on a
      # host that has one, not here.
      - name: The plugin's own suite
        working-directory: '@afkd/gitea'
        run: cargo test --locked

      # `cp -a` then `tar`, so the mode bits ride: the skill's scripts are run as they arrive.
      # The suite above built `target/` inside the plugin, and the copy must not carry it: it
      # is one runner's build, and afkd builds the plugin afresh on the host it lands on.
      - name: Pack
        run: |
          cp -a '@afkd/gitea' afkd-gitea
          rm -rf afkd-gitea/target
          tar czf afkd-gitea.tar.gz afkd-gitea
          # Assert the shape rather than trust it. One top-level directory and no more — a
          # second entry would be placed verbatim instead of unwrapped. The manifest is what
          # afkd reads and the lockfile is what its `--locked` build needs. A `target/` would
          # ship this runner's build. The listing is read from a file: under the runner's
          # `pipefail`, a `grep -q` that stops reading early can fail `tar` on SIGPIPE, and a
          # `! pipeline` never trips `-e`.
          tar tzf afkd-gitea.tar.gz > listing
          roots=$(cut -d/ -f1 listing | sort -u)
          test "$roots" = "afkd-gitea"
          grep -qx 'afkd-gitea/afkd-plugin.toml' listing
          grep -qx 'afkd-gitea/Cargo.lock' listing
          if grep '^afkd-gitea/target\(/\|$\)' listing; then
            echo "the tarball ships a target/" >&2
            exit 1
          fi
          rm listing
          # Unpacked, not read off the listing: `test -x` after extraction is the same
          # question afkd's own unpack answers, asked the same way.
          mkdir -p shape && tar xzf afkd-gitea.tar.gz -C shape
          test -x shape/afkd-gitea/skills/gitea/ask.py
          rm -rf shape afkd-gitea

      # Delete-then-create, because a tag is unique and the replacement cannot be made
      # first. The brief 404 window on the download URL is a loud, retryable failure for an
      # `afkd update` that races it.
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' '@afkd/gitea/afkd-plugin.toml')
          test -n "$version"
          printf '`afkd install @afkd/gitea`, or `afkd update @afkd/gitea` if you already have it.\n\nCut from %s.\n' "$GITHUB_SHA" > notes.md
          gh release delete gitea --yes --cleanup-tag || true
          gh release create gitea --target "$GITHUB_SHA" --title "@afkd/gitea $version" --notes-file notes.md afkd-gitea.tar.gz
