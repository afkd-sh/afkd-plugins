name = "@afkd/linear"
version = "0.13.0"
proto = 2
shape = "provider"
source = "https://github.com/afkd-sh/afkd-plugins"
exec = "afkd-linear"

# An issue's priority, Linear's 0 to 4.
[[enum]]
name = "Priority"
values = ["none", "urgent", "high", "medium", "low"]

# The category of a workflow state. Linear's `duplicate` reads as `canceled`.
[[enum]]
name = "State_Type"
values = ["triage", "backlog", "unstarted", "started", "completed", "canceled"]

# A key of Linear's own sort on issues, what `issues` orders by, at most three to an `order`.
[[enum]]
name = "Sort"
values = ["manual", "team", "state", "priority", "assignee", "project", "cycle", "due", "estimate", "title", "created", "updated", "completed"]

# The credentials a read reaches Linear with: exactly one of a personal API key, or an OAuth
# app's client id and secret, which the plugin trades for the app's own token. A credential
# reaches one workspace, so two workspaces are two values.
[[struct]]
name = "Workspace"

  [[struct.field]]
  name = "api_key"
  type = "str?"
  secret = true

  [[struct.field]]
  name = "client_id"
  type = "str?"

  [[struct.field]]
  name = "client_secret"
  type = "str?"
  secret = true

  # A stand-in's address, in tests.
  [[struct.field]]
  name = "base_url"
  type = "str"
  default = "https://api.linear.app"

# An issue: the item a `service(linear)` run claims, and every issue a read or a write hands back.
# afkd carries `id` (the issue's identifier, `ENG-123`) and `key` for every handle: afkd's
# claim key for a claimed issue, and `linear:<organization uuid>/<issue uuid>` for one a read
# hands back. The fields below are the rest of what the plugin knows about an issue. Every one
# is always sent, since a field left out is not delivered and a slot reading it would fail its
# run: one that holds nothing as `null`, and a list with nothing in it empty. A time is unix
# milliseconds.
[[handle]]
name = "Issue"

  # Linear's id for the issue, the same after it moves team and its identifier changes.
  [[handle.field]]
  name = "uuid"
  type = "str"

  # The url key of the workspace it is in.
  [[handle.field]]
  name = "workspace"
  type = "str"

  # Its team's key.
  [[handle.field]]
  name = "team"
  type = "str"

  [[handle.field]]
  name = "title"
  type = "str"

  [[handle.field]]
  name = "url"
  type = "str"

  # Markdown, "" when it has none.
  [[handle.field]]
  name = "description"
  type = "str"

  # Linear's git branch name for it.
  [[handle.field]]
  name = "branch"
  type = "str"

  # The name of the workflow state it sits in.
  [[handle.field]]
  name = "state"
  type = "str"

  [[handle.field]]
  name = "state_type"
  type = "State_Type"

  [[handle.field]]
  name = "priority"
  type = "Priority"

  [[handle.field]]
  name = "estimate"
  type = "int?"

  # Its due date, YYYY-MM-DD.
  [[handle.field]]
  name = "due"
  type = "str?"

  # The display names of who it is assigned and delegated to, and of who filed it, nil for
  # an issue an integration filed.
  [[handle.field]]
  name = "assignee"
  type = "str?"

  [[handle.field]]
  name = "delegate"
  type = "str?"

  [[handle.field]]
  name = "creator"
  type = "str?"

  # The names of its project and milestone, and its cycle's number.
  [[handle.field]]
  name = "project"
  type = "str?"

  [[handle.field]]
  name = "milestone"
  type = "str?"

  [[handle.field]]
  name = "cycle"
  type = "int?"

  # The names of the labels on it.
  [[handle.field]]
  name = "labels"
  type = "list[str]"

  # The parent issue's identifier.
  [[handle.field]]
  name = "parent"
  type = "str?"

  # The sub-issues' identifiers, in Linear's order.
  [[handle.field]]
  name = "sub_issues"
  type = "list[str]"

  # The identifiers of the issues it relates to, one list per relation, done or not.
  [[handle.field]]
  name = "blocks"
  type = "list[str]"

  [[handle.field]]
  name = "blocked_by"
  type = "list[str]"

  [[handle.field]]
  name = "related"
  type = "list[str]"

  [[handle.field]]
  name = "similar"
  type = "list[str]"

  [[handle.field]]
  name = "duplicates"
  type = "list[str]"

  [[handle.field]]
  name = "duplicate_of"
  type = "str?"

  # The urls of its links, Linear's attachments.
  [[handle.field]]
  name = "links"
  type = "list[str]"

  # The display names of its subscribers.
  [[handle.field]]
  name = "subscribers"
  type = "list[str]"

  [[handle.field]]
  name = "created_at"
  type = "time"

  [[handle.field]]
  name = "updated_at"
  type = "time"

  # nil unless it was completed or canceled.
  [[handle.field]]
  name = "completed_at"
  type = "time?"

  [[handle.field]]
  name = "canceled_at"
  type = "time?"

  # Whether it is archived (a trashed issue is too), and whether it is in the trash.
  [[handle.field]]
  name = "archived"
  type = "bool"

  [[handle.field]]
  name = "trashed"
  type = "bool"

# A comment, its `id` its uuid.
[[handle]]
name = "Comment"

  # The identifier of the issue it is on.
  [[handle.field]]
  name = "issue"
  type = "str"

  [[handle.field]]
  name = "body"
  type = "str"

  [[handle.field]]
  name = "url"
  type = "str"

  # Its author's display name, or the integration's or the external user's name.
  [[handle.field]]
  name = "author"
  type = "str?"

  # The id of the comment it answers.
  [[handle.field]]
  name = "reply_to"
  type = "str?"

  [[handle.field]]
  name = "resolved_at"
  type = "time?"

  [[handle.field]]
  name = "created_at"
  type = "time"

  [[handle.field]]
  name = "edited_at"
  type = "time?"

# A team, its `id` its key (`ENG`).
[[handle]]
name = "Team"

  [[handle.field]]
  name = "name"
  type = "str"

# A workflow state, its `id` its uuid.
[[handle]]
name = "State"

  [[handle.field]]
  name = "name"
  type = "str"

  [[handle.field]]
  name = "type"
  type = "State_Type"

  # Its team's key.
  [[handle.field]]
  name = "team"
  type = "str"

# A label, its `id` its uuid.
[[handle]]
name = "Label"

  [[handle.field]]
  name = "name"
  type = "str"

  # The name of the label group it is in.
  [[handle.field]]
  name = "group"
  type = "str?"

  # Its team's key, nil for a workspace label.
  [[handle.field]]
  name = "team"
  type = "str?"

# A user, its `id` its uuid.
[[handle]]
name = "User"

  # The display name.
  [[handle.field]]
  name = "name"
  type = "str"

  [[handle.field]]
  name = "full_name"
  type = "str"

  [[handle.field]]
  name = "email"
  type = "str"

  # Whether it is an app's user.
  [[handle.field]]
  name = "app"
  type = "bool"

# A project, its `id` its uuid.
[[handle]]
name = "Project"

  [[handle.field]]
  name = "name"
  type = "str"

  # Its teams' keys.
  [[handle.field]]
  name = "teams"
  type = "list[str]"

  # Its milestones' names, in order.
  [[handle.field]]
  name = "milestones"
  type = "list[str]"

  [[handle.field]]
  name = "url"
  type = "str"

# A cycle, its `id` its uuid.
[[handle]]
name = "Cycle"

  [[handle.field]]
  name = "number"
  type = "int"

  [[handle.field]]
  name = "name"
  type = "str?"

  # Its team's key.
  [[handle.field]]
  name = "team"
  type = "str"

  [[handle.field]]
  name = "starts_at"
  type = "time"

  [[handle.field]]
  name = "ends_at"
  type = "time"

  [[handle.field]]
  name = "active"
  type = "bool"

# The one kind, `service(linear)` in a config: Linear teams whose issues are claimed one per
# run. afkd's own claim keys, `every` and `max_attempts`, are afkd's and not declared here.
[[kind]]
name = "intake"
role = "trigger"
main = true
claims = true

  # The credential, as a `linear.Workspace`'s fields: a Linear API key, or an OAuth app's
  # `client_id` and `client_secret`, from which the plugin fetches the app's own token. Exactly
  # one of the two is written; one written `nil` or `""` is not written.
  [[kind.setting]]
  name = "api_key"
  type = "str?"

  [[kind.setting]]
  name = "client_id"
  type = "str?"

  [[kind.setting]]
  name = "client_secret"
  type = "str?"

  # A stand-in's address, in tests.
  [[kind.setting]]
  name = "base_url"
  type = "str"
  default = "https://api.linear.app"

  # The keys of the teams issues are claimed from (`ENG`), scanned in the order written.
  [[kind.setting]]
  name = "team"
  type = "list[str]"
  required = true

  # The workflow states issues are claimed from, by name, scanned in the order written in
  # each team.
  [[kind.setting]]
  name = "claim_from"
  type = "list[str]"
  required = true

  # Each `only_*` claims only an issue the `issues` filter of the name after `only_` keeps.
  [[kind.setting]]
  name = "only_state_type"
  type = "list[State_Type]"

  [[kind.setting]]
  name = "only_priority"
  type = "list[Priority]"

  [[kind.setting]]
  name = "only_labels"
  type = "list[str]"

  [[kind.setting]]
  name = "only_assignee"
  type = "list[str]"

  [[kind.setting]]
  name = "only_delegate"
  type = "list[str]"

  [[kind.setting]]
  name = "only_project"
  type = "list[str]"

  [[kind.setting]]
  name = "only_milestone"
  type = "list[str]"

  [[kind.setting]]
  name = "only_cycle"
  type = "list[int]"

  [[kind.setting]]
  name = "only_parent"
  type = "list[str]"

  [[kind.setting]]
  name = "only_text"
  type = "str"

  # No issue carrying any of these labels is claimed, as `issues`'s `without_labels`.
  [[kind.setting]]
  name = "skip_labels"
  type = "list[str]"

  # `anyone`, or the users whose reply re-arms an issue afkd spoke on last.
  [[kind.setting]]
  name = "discuss_with"
  type = "list[str]"

  # The slots afkd runs, each passed the run, the workspace the credential settings build and
  # the issue, and after the run its outcome.
  [[kind.slot]]
  name = "on_run"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "workspace"
    type = "Workspace"

    [[kind.slot.param]]
    name = "issue"
    type = "Issue"

  [[kind.slot]]
  name = "on_claim"
  when = "pre"

    [[kind.slot.param]]
    name = "workspace"
    type = "Workspace"

    [[kind.slot.param]]
    name = "issue"
    type = "Issue"

  [[kind.slot]]
  name = "on_done"
  when = "post"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "workspace"
    type = "Workspace"

    [[kind.slot.param]]
    name = "issue"
    type = "Issue"

    [[kind.slot.param]]
    name = "outcome"
    type = "afkd.Outcome"

  [[kind.slot]]
  name = "on_fail"
  when = "post"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "workspace"
    type = "Workspace"

    [[kind.slot.param]]
    name = "issue"
    type = "Issue"

    [[kind.slot.param]]
    name = "outcome"
    type = "afkd.Outcome"

  [[kind.slot]]
  name = "on_park"
  when = "post"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "workspace"
    type = "Workspace"

    [[kind.slot.param]]
    name = "issue"
    type = "Issue"

    [[kind.slot.param]]
    name = "outcome"
    type = "afkd.Outcome"

# The reads. Each takes a `linear.Workspace` first and reaches Linear only through it, so a
# read answers alike from any service's slots, and reads no service's settings. A read is
# done now or refused, never queued.

# One issue, by its identifier or its uuid, as Linear's own `issue(id:)` takes them: by its uuid
# it is read anew even after it moved team. None found is refused.
[[action]]
name = "issue"
returns = "Issue"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  # An identifier (ENG-123) or a uuid.
  [[action.param]]
  name = "id"
  type = "str"
  required = true

# The issues every filter given keeps, workspace-wide unless `team` says. A list on a
# single-valued field keeps an issue holding any of it; `labels` keeps one carrying every one.
[[action]]
name = "issues"
returns = "list[Issue]"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  # Identifiers or uuids.
  [[action.param]]
  name = "id"
  type = "list[str]"
  named_only = true

  [[action.param]]
  name = "team"
  type = "list[str]"
  named_only = true

  [[action.param]]
  name = "state"
  type = "list[str]"
  named_only = true

  [[action.param]]
  name = "state_type"
  type = "list[State_Type]"
  named_only = true

  [[action.param]]
  name = "priority"
  type = "list[Priority]"
  named_only = true

  [[action.param]]
  name = "labels"
  type = "list[str]"
  named_only = true

  [[action.param]]
  name = "without_labels"
  type = "list[str]"
  named_only = true

  # Users by display name or email, "me", or "none" for nobody.
  [[action.param]]
  name = "assignee"
  type = "list[str]"
  named_only = true

  [[action.param]]
  name = "delegate"
  type = "list[str]"
  named_only = true

  [[action.param]]
  name = "project"
  type = "list[str]"
  named_only = true

  [[action.param]]
  name = "milestone"
  type = "list[str]"
  named_only = true

  [[action.param]]
  name = "cycle"
  type = "list[int]"
  named_only = true

  # Sub-issues of these identifiers or uuids.
  [[action.param]]
  name = "parent"
  type = "list[str]"
  named_only = true

  # true keeps an issue an open issue blocks, false one no open issue blocks.
  [[action.param]]
  name = "blocked"
  type = "bool"
  named_only = true

  # In the title or the description, case ignored.
  [[action.param]]
  name = "text"
  type = "str"
  named_only = true

  [[action.param]]
  name = "created_after"
  type = "time"
  named_only = true

  [[action.param]]
  name = "created_before"
  type = "time"
  named_only = true

  [[action.param]]
  name = "updated_after"
  type = "time"
  named_only = true

  [[action.param]]
  name = "updated_before"
  type = "time"
  named_only = true

  [[action.param]]
  name = "completed_after"
  type = "time"
  named_only = true

  [[action.param]]
  name = "completed_before"
  type = "time"
  named_only = true

  [[action.param]]
  name = "canceled_after"
  type = "time"
  named_only = true

  [[action.param]]
  name = "canceled_before"
  type = "time"
  named_only = true

  # YYYY-MM-DD.
  [[action.param]]
  name = "due_after"
  type = "str"
  named_only = true

  [[action.param]]
  name = "due_before"
  type = "str"
  named_only = true

  # Archived and trashed issues too.
  [[action.param]]
  name = "include_archived"
  type = "bool"
  named_only = true
  default = false

  # Linear's own sort, at most three keys, each breaking the ties of the one before.
  [[action.param]]
  name = "order"
  type = "list[Sort]"
  named_only = true
  default = ["team", "state", "manual"]

  # 1 to 250, Linear's largest page.
  [[action.param]]
  name = "limit"
  type = "int"
  named_only = true
  default = 50

# The issue's comments, oldest first, each reply right after the comment it answers.
[[action]]
name = "comments"
returns = "list[Comment]"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

# The user the credential acts as.
[[action]]
name = "me"
returns = "User"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

# The workspace's users, apps included, disabled accounts not.
[[action]]
name = "users"
returns = "list[User]"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

# The teams the credential can reach.
[[action]]
name = "teams"
returns = "list[Team]"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

# The team's workflow states, in workflow order.
[[action]]
name = "states"
returns = "list[State]"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  # The team's key.
  [[action.param]]
  name = "team"
  type = "str"
  required = true

# The workspace's labels, and the team's when given.
[[action]]
name = "labels"
returns = "list[Label]"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  [[action.param]]
  name = "team"
  type = "str"
  named_only = true

# The workspace's projects, or the team's when given.
[[action]]
name = "projects"
returns = "list[Project]"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  [[action.param]]
  name = "team"
  type = "str"
  named_only = true

# The team's cycles, oldest first.
[[action]]
name = "cycles"
returns = "list[Cycle]"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  [[action.param]]
  name = "team"
  type = "str"
  required = true

# The urls of every file Linear hosts that the issue's description and comments link: the
# description's first, then the comments' oldest first, each once. A link in one of afkd's own
# control markers is left out, though `comments` returns the markers themselves.
[[action]]
name = "files"
returns = "list[str]"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

# The file at `url` saved to the absolute path `to`, fetched with the credential Linear's
# file host asks for, from Linear and from no other host.
[[action]]
name = "download_file"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  [[action.param]]
  name = "url"
  type = "str"
  required = true

  [[action.param]]
  name = "to"
  type = "str"
  required = true

# The writes. Each takes a `linear.Workspace` first and reaches Linear only through it, as a
# read does, and gives back what it changed as Linear then holds it. A write is done now or
# refused, never queued. A team, a state, a user, a project or a milestone is named as Linear
# shows it and matched exactly, its id taken in its place: a name that matches nothing is
# refused naming what there is, and one that matches several listing their ids.

# File an issue in `team`, in the team's default state unless `state` says. A parameter left
# out, or `nil`, leaves its field empty. `at` or `after` places it in its state; with neither,
# Linear places it.
[[action]]
name = "create_issue"
returns = "Issue"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  # A team's key.
  [[action.param]]
  name = "team"
  type = "str"
  required = true

  [[action.param]]
  name = "title"
  type = "str"
  required = true

  # Markdown.
  [[action.param]]
  name = "description"
  type = "str"
  named_only = true

  # Absolute paths, each read when called and embedded after the description: an image shown,
  # any other file linked.
  [[action.param]]
  name = "files"
  type = "list[str]"
  named_only = true

  # A state of `team`.
  [[action.param]]
  name = "state"
  type = "str"
  named_only = true

  # The place in the state.
  [[action.param]]
  name = "at"
  type = "enum"
  values = ["top", "bottom"]
  named_only = true

  # Right below this issue in the state.
  [[action.param]]
  name = "after"
  type = "Issue"
  named_only = true

  [[action.param]]
  name = "priority"
  type = "Priority"
  named_only = true

  [[action.param]]
  name = "estimate"
  type = "int?"
  named_only = true

  # YYYY-MM-DD.
  [[action.param]]
  name = "due"
  type = "str?"
  named_only = true

  # Labels of `team` or of the workspace, by name.
  [[action.param]]
  name = "labels"
  type = "list[str]"
  named_only = true

  # A user's display name or email, or "me".
  [[action.param]]
  name = "assignee"
  type = "str?"
  named_only = true

  [[action.param]]
  name = "delegate"
  type = "str?"
  named_only = true

  [[action.param]]
  name = "project"
  type = "str?"
  named_only = true

  # A milestone of `project`.
  [[action.param]]
  name = "milestone"
  type = "str?"
  named_only = true

  # A cycle's number, of `team`.
  [[action.param]]
  name = "cycle"
  type = "int?"
  named_only = true

  [[action.param]]
  name = "parent"
  type = "Issue?"
  named_only = true

# Change an issue's fields: each one given is set, `nil` clears it, and one left out is left as
# it is. `team` moves the issue to that team, and needs a `state` of that team beside it; Linear
# drops what the new team lacks. `at` or `after` places it in its state, the new one or the one
# it is in; with neither, Linear places it.
[[action]]
name = "update_issue"
returns = "Issue"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "title"
  type = "str"
  named_only = true

  # Markdown; "" empties it.
  [[action.param]]
  name = "description"
  type = "str"
  named_only = true

  # Absolute paths, each read when called and embedded after the description: an image shown,
  # any other file linked. Only beside `description`.
  [[action.param]]
  name = "files"
  type = "list[str]"
  named_only = true

  # A state of the issue's team, or of `team`.
  [[action.param]]
  name = "state"
  type = "str"
  named_only = true

  # A team's key.
  [[action.param]]
  name = "team"
  type = "str"
  named_only = true

  # The place in the state.
  [[action.param]]
  name = "at"
  type = "enum"
  values = ["top", "bottom"]
  named_only = true

  # Right below this issue in the state.
  [[action.param]]
  name = "after"
  type = "Issue"
  named_only = true

  [[action.param]]
  name = "priority"
  type = "Priority"
  named_only = true

  [[action.param]]
  name = "estimate"
  type = "int?"
  named_only = true

  # YYYY-MM-DD.
  [[action.param]]
  name = "due"
  type = "str?"
  named_only = true

  # A user's display name or email, or "me".
  [[action.param]]
  name = "assignee"
  type = "str?"
  named_only = true

  [[action.param]]
  name = "delegate"
  type = "str?"
  named_only = true

  [[action.param]]
  name = "project"
  type = "str?"
  named_only = true

  # A milestone of the issue's project, or of `project`.
  [[action.param]]
  name = "milestone"
  type = "str?"
  named_only = true

  # A cycle's number, of the issue's team or of `team`.
  [[action.param]]
  name = "cycle"
  type = "int?"
  named_only = true

  [[action.param]]
  name = "parent"
  type = "Issue?"
  named_only = true

# Put the label on the issue: the issue's team's label of that name, else the workspace's. A
# label the issue already carries is left as it is.
[[action]]
name = "add_label"
returns = "Issue"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "label"
  type = "str"
  required = true

# Take the label off the issue, named as `add_label` names it. A label the issue does not carry
# is left as it is.
[[action]]
name = "remove_label"
returns = "Issue"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "label"
  type = "str"
  required = true

# Relate the issue to `other`: afterwards `other`'s identifier is in the issue's field named
# for `relation`, and the issue's in `other`'s matching one. A relation the issue already holds
# is left as it is.
[[action]]
name = "add_relation"
returns = "Issue"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  # The issue's field `other` goes in.
  [[action.param]]
  name = "relation"
  type = "enum"
  values = ["blocks", "blocked_by", "related", "similar", "duplicate_of", "duplicates"]
  required = true

  [[action.param]]
  name = "other"
  type = "Issue"
  required = true

# Take the relation off: afterwards `other`'s identifier is no longer in the issue's field
# named for `relation`. A relation the issue does not hold is left as it is.
[[action]]
name = "remove_relation"
returns = "Issue"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "relation"
  type = "enum"
  values = ["blocks", "blocked_by", "related", "similar", "duplicate_of", "duplicates"]
  required = true

  [[action.param]]
  name = "other"
  type = "Issue"
  required = true

# Link `url` on the issue, Linear's attachment. Adding a url the issue already links titles
# that link `title`, when one is given.
[[action]]
name = "add_link"
returns = "Issue"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "url"
  type = "str"
  required = true

  [[action.param]]
  name = "title"
  type = "str"
  named_only = true

# Take the link to `url` off the issue. A url it does not link is left as it is.
[[action]]
name = "remove_link"
returns = "Issue"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "url"
  type = "str"
  required = true

# Subscribe a user to the issue: a display name or email, or "me".
[[action]]
name = "add_subscriber"
returns = "Issue"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "user"
  type = "str"
  default = "me"

# Unsubscribe a user from the issue: a display name or email, or "me".
[[action]]
name = "remove_subscriber"
returns = "Issue"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "user"
  type = "str"
  default = "me"

# Archive the issue, its sub-issues with it, as Linear does.
[[action]]
name = "archive_issue"
returns = "Issue"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

# Take the issue back out of the archive, its sub-issues with it, or out of the trash within
# Linear's 30 days.
[[action]]
name = "unarchive_issue"
returns = "Issue"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

# Put the issue in Linear's trash, its sub-issues with it, as Linear does. `unarchive_issue`
# takes it back within 30 days.
[[action]]
name = "delete_issue"
returns = "Issue"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

# Post `body` as a comment on the issue, markdown, each of `files` embedded after it: an image
# shown, any other file linked. With `reply_to` it goes in that comment's thread, a comment on
# the same issue; a reply to a reply goes in the thread both are in.
[[action]]
name = "create_comment"
returns = "Comment"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "body"
  type = "str"
  required = true

  # Absolute paths, each read when called.
  [[action.param]]
  name = "files"
  type = "list[str]"
  named_only = true

  [[action.param]]
  name = "reply_to"
  type = "Comment"
  named_only = true

# Rewrite the comment's body, each of `files` embedded after it.
[[action]]
name = "update_comment"
returns = "Comment"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  [[action.param]]
  name = "comment"
  type = "Comment"
  required = true

  [[action.param]]
  name = "body"
  type = "str"
  required = true

  # Absolute paths, each read when called.
  [[action.param]]
  name = "files"
  type = "list[str]"
  named_only = true

# Resolve the thread the comment is in, and give back the thread's first comment, which
# carries `resolved_at`. A reply resolves its thread, as the reply that resolved it.
[[action]]
name = "resolve_comment"
returns = "Comment"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  [[action.param]]
  name = "comment"
  type = "Comment"
  required = true

# Unresolve the thread the comment is in, and give back the thread's first comment.
[[action]]
name = "unresolve_comment"
returns = "Comment"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  [[action.param]]
  name = "comment"
  type = "Comment"
  required = true

# Delete the comment. A thread's first comment takes its replies with it, as Linear does.
[[action]]
name = "delete_comment"

  [[action.param]]
  name = "ws"
  type = "Workspace"
  required = true

  [[action.param]]
  name = "comment"
  type = "Comment"
  required = true
