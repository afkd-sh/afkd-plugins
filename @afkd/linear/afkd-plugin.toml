name = "@afkd/linear"
version = "0.5.1"
proto = 2
shape = "provider"
source = "https://github.com/afkd-sh/afkd-plugins"
exec = "afkd-linear"

# The item a run claims, `linear.Issue` in a config: every slot is passed it, and every
# action takes it first. afkd carries `id` (the issue's identifier, `ENG-123`) and `key`
# (afkd's claim key) for every handle; the
# fields below are the rest of what the plugin knows about an issue. Every one is always sent,
# since a field left out is not delivered and a slot reading it would fail its run: an issue
# with no parent sends `parent` as `""`, and one with no label, sub-issue or blocker an empty
# list.
[[handle]]
name = "Issue"

  [[handle.field]]
  name = "title"
  type = "string"

  [[handle.field]]
  name = "url"
  type = "string"

  [[handle.field]]
  name = "labels"
  type = "list[string]"

  # The name of the workflow state the issue sat in when it was claimed.
  [[handle.field]]
  name = "state"
  type = "string"

  # The parent issue's identifier, or "" for an issue that is no sub-issue.
  [[handle.field]]
  name = "parent"
  type = "string"

  # The sub-issues' identifiers, in Linear's order.
  [[handle.field]]
  name = "sub_issues"
  type = "list[string]"

  # The identifiers of every issue that blocks this one, done or not.
  [[handle.field]]
  name = "blocked_by"
  type = "list[string]"

# The one kind, `service(linear)` in a config: a Linear team whose issues are claimed one per
# run. afkd's own claim keys, `every` and `max_attempts`, are afkd's and not declared here.
[[kind]]
name = "issue"
role = "trigger"
main = true
claims = true

  # The team's key, the prefix of every identifier it holds (`ENG`).
  [[kind.setting]]
  name = "team"
  type = "string"
  required = true

  [[kind.setting]]
  name = "base_url"
  type = "string"

  # The credential: a Linear API key, or an OAuth app's `client_id` and `client_secret`, from
  # which the plugin fetches the app's own token. Exactly one of the two is written.
  [[kind.setting]]
  name = "api_key"
  type = "string"

  [[kind.setting]]
  name = "client_id"
  type = "string"

  [[kind.setting]]
  name = "client_secret"
  type = "string"

  # The workflow states new issues are claimed from, by name, in the order they are scanned.
  [[kind.setting]]
  name = "pick_from"
  type = "list[string]"
  required = true

  # Who must hold an issue for it to be claimed, any one of them: `me`, a user by display
  # name or email as assignee or delegate, or `none` for an issue with neither.
  [[kind.setting]]
  name = "require_member"
  type = "list[string]"

  [[kind.setting]]
  name = "require_label"
  type = "string"

  [[kind.setting]]
  name = "without_label"
  type = "list[string]"

  [[kind.setting]]
  name = "discuss_with"
  type = "list[string]"

  # The slots afkd runs, each passed the run and its issue, and after the run its outcome.
  [[kind.slot]]
  name = "on_run"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "issue"
    type = "Issue"

  [[kind.slot]]
  name = "on_claim"
  when = "pre"

    [[kind.slot.param]]
    name = "issue"
    type = "Issue"

  [[kind.slot]]
  name = "on_done"
  when = "post"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "issue"
    type = "Issue"

    [[kind.slot.param]]
    name = "outcome"
    type = "afkd.Outcome"

  [[kind.slot]]
  name = "on_fail"
  when = "post"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "issue"
    type = "Issue"

    [[kind.slot.param]]
    name = "outcome"
    type = "afkd.Outcome"

  [[kind.slot]]
  name = "on_park"
  when = "post"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "issue"
    type = "Issue"

    [[kind.slot.param]]
    name = "outcome"
    type = "afkd.Outcome"

# The actions a slot calls, each on the issue it is passed first. A write is done in the
# service's team, and queued and retried like every write when Linear is down.

# A comment on the issue, its text verbatim.
[[action]]
name = "comment"

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "text"
  type = "string"
  required = true

  # Files to put on the issue, by absolute path, each read when the slot calls and embedded
  # after the text on a paragraph of its own: an image shown, any other file linked.
  [[action.param]]
  name = "files"
  type = "list[string]"
  named_only = true
  default = []

# The issue's description, replaced with `text`.
[[action]]
name = "describe"

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "text"
  type = "string"
  required = true

  # Files to put on the issue, embedded after the text as `comment`'s are.
  [[action.param]]
  name = "files"
  type = "list[string]"
  named_only = true
  default = []

# The issue's title, replaced with `title`.
[[action]]
name = "rename"

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "title"
  type = "string"
  required = true

# The issue moved to the team's workflow state named `state`.
[[action]]
name = "move_to"

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "state"
  type = "string"
  required = true

# The label named `label` put on the issue: the team's, else the workspace's, else one
# created for the team.
[[action]]
name = "add_label"

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "label"
  type = "string"
  required = true

# The label named `label` taken off the issue; a name with no label is a no-op.
[[action]]
name = "remove_label"

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "label"
  type = "string"
  required = true

# The issue delegated to `to`: `me`, the app the service runs as, or an app's user by display
# name or email.
[[action]]
name = "delegate"

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "to"
  type = "string"
  required = true

# A new issue in the service's team, titled `title` and described `description`.
[[action]]
name = "create_issue"

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "title"
  type = "string"
  required = true

  [[action.param]]
  name = "description"
  type = "string"
  default = ""

  # The workflow state it starts in, by name; the team's default when left out.
  [[action.param]]
  name = "state"
  type = "string"
  named_only = true

# A new sub-issue of the issue, in the service's team, as `create_issue` files one.
[[action]]
name = "create_sub_issue"

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "title"
  type = "string"
  required = true

  [[action.param]]
  name = "description"
  type = "string"
  default = ""

  # The workflow state it starts in, by name; the team's default when left out.
  [[action.param]]
  name = "state"
  type = "string"
  named_only = true

# The issue archived.
[[action]]
name = "archive"

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

# The issue's thread, oldest first and as the brief renders it, written to the absolute
# path `to`. A read, never queued: now or refused.
[[action]]
name = "list_comments"

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "to"
  type = "string"
  required = true

# The issue's description as Linear holds it now, written to the absolute path `to`.
[[action]]
name = "read_description"

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "to"
  type = "string"
  required = true

# The issue's sub-issues, a line each with its state as the brief lists them, written to
# the absolute path `to`.
[[action]]
name = "list_sub_issues"

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "to"
  type = "string"
  required = true

# The issue's sub-issue `sub_issue`, by identifier, moved to the team's workflow state
# named `state`.
[[action]]
name = "move_sub_issue"

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "sub_issue"
  type = "string"
  required = true

  [[action.param]]
  name = "state"
  type = "string"
  required = true

# Every file Linear hosts that the issue embeds or links — its description's, then its
# thread's oldest first, each once — written into the existing directory `to`, numbered in
# that order: `1-screenshot.png`, `2-run.log`. A read, never queued; an issue with no file
# writes nothing.
[[action]]
name = "fetch_files"

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "to"
  type = "string"
  required = true
