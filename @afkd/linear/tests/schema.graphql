  users(
    after: String
    before: String
    filter: UserFilter
    first: Int
    includeArchived: Boolean
    includeDisabled: Boolean
    last: Int
    orderBy: PaginationOrderBy
    sort: [UserSortInput!]
  ): UserConnection!
