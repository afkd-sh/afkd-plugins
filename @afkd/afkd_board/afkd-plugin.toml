name = "@afkd/afkd_board"
version = "0.4.0"
proto = 2
shape = "provider"
source = "https://github.com/afkd-sh/afkd-plugins"
exec = "afkd-afkd_board"

# The board a read reaches, by one of its API keys, made in its Board settings. A key reaches
# one board, so two boards are two values.
[[struct]]
name = "Board"

  # afk_board_…, which afkd never prints.
  [[struct.field]]
  name = "key"
  type = "str"
  secret = true

  # A stand-in's address, in tests.
  [[struct.field]]
  name = "base_url"
  type = "str"
  default = "https://app.afkd.sh"

# One item of a card's checklist, read with `checklist`.
[[struct]]
name = "Item"

  [[struct.field]]
  name = "text"
  type = "str"

  [[struct.field]]
  name = "done"
  type = "bool"

# A list of the board, read with the board.
[[struct]]
name = "List"

  [[struct.field]]
  name = "id"
  type = "str"

  [[struct.field]]
  name = "name"
  type = "str"

# A label of the board, read with the board.
[[struct]]
name = "Label"

  [[struct.field]]
  name = "name"
  type = "str"

  [[struct.field]]
  name = "colour"
  type = "str"

# A card. afkd carries `id`, the card's number as its digits (`17`), and `key`,
# `afkd_board:<board uuid>/<card uuid>`, which `==` compares. The fields below are the rest of what
# the plugin knows about a card. Every one is always sent, since a field left out is not
# delivered and a slot reading it would fail its run. A time is unix milliseconds.
[[handle]]
name = "Card"

  # 17 for #17.
  [[handle.field]]
  name = "number"
  doc = "The card's number on the board, such as 17"
  type = "int"

  [[handle.field]]
  name = "title"
  doc = "The card's title"
  type = "str"

  # Markdown, "" when it has none.
  [[handle.field]]
  name = "description"
  doc = "The card's description in Markdown, empty when it has none"
  type = "str"

  # The name of the list it is in.
  [[handle.field]]
  name = "list"
  doc = "The name of the list the card is in"
  type = "str"

  # By name, in the order they were put on.
  [[handle.field]]
  name = "labels"
  doc = "The names of the card's labels, in the order they were put on"
  type = "list[str]"

  [[handle.field]]
  name = "archived"
  doc = "Whether the card is archived"
  type = "bool"

  [[handle.field]]
  name = "done"
  doc = "Whether the card is done"
  type = "bool"

  # The numbers of the cards it is blocked by, done or not, and of those it blocks.
  [[handle.field]]
  name = "blocked_by"
  doc = "The numbers of the cards that block it, done or not"
  type = "list[int]"

  [[handle.field]]
  name = "blocking"
  doc = "The numbers of the cards it blocks"
  type = "list[int]"

  # Whether a card it is blocked by is not done.
  [[handle.field]]
  name = "blocked"
  doc = "Whether a card that blocks it is not done"
  type = "bool"

  [[handle.field]]
  name = "url"
  doc = "The link to the card on the board"
  type = "str"

  [[handle.field]]
  name = "created_at"
  doc = "When the card was made"
  type = "time"

  # The newest of when it was made, its changes and its comments.
  [[handle.field]]
  name = "updated_at"
  doc = "The newest of when it was made, changed or commented on"
  type = "time"

# A comment on a card. afkd carries `id`, the comment's uuid, and `key`,
# `afkd_board:<board uuid>/<comment uuid>`.
[[handle]]
name = "Comment"

  # The number of the card it is on.
  [[handle.field]]
  name = "card"
  doc = "The number of the card it is on"
  type = "int"

  [[handle.field]]
  name = "body"
  doc = "The text of the comment"
  type = "str"

  # The name of the person who made it; nil for a comment a key made, and once the person's
  # account is deleted.
  [[handle.field]]
  name = "author"
  doc = "The name of the person who made it, nil for a key's or a deleted one"
  type = "str?"

  # The id of the run it was made in.
  [[handle.field]]
  name = "run"
  doc = "The id of the run it was made in, nil for none"
  type = "str?"

  [[handle.field]]
  name = "created_at"
  doc = "When the comment was made"
  type = "time"

  # Its card's url, since a comment has no address of its own.
  [[handle.field]]
  name = "url"
  doc = "The link to its card, since a comment has no address of its own"
  type = "str"

# The one kind, `service(afkd_board)` in a config: a board whose cards are claimed one per run.
# `key` and `base_url` are `Board`'s own fields, and are the `Board` every slot is passed. A card
# is claimed by the `afkd/claimed` label, which comes off once the card's `on_done`, `on_park` or
# `on_fail` has run, or at the next start after a crash.
[[kind]]
name = "board"
doc = "A board whose cards are claimed one per run"
role = "trigger"
main = true
claims = true

  [[kind.setting]]
  name = "key"
  doc = "One of the board's API keys, made in its Board settings"
  type = "str"
  required = true

  [[kind.setting]]
  name = "base_url"
  doc = "The board's address, when not the public one"
  type = "str"
  default = "https://app.afkd.sh"

  [[kind.setting]]
  name = "claim_from"
  doc = "The lists to claim cards from, first one first, each from the top"
  type = "list[str]"
  required = true

  [[kind.setting]]
  name = "only_labels"
  doc = "Claim only a card that carries every one of these labels"
  type = "list[str]"

  [[kind.setting]]
  name = "skip_labels"
  doc = "Never claim a card carrying any of these labels"
  type = "list[str]"

  # No default: left out, a card is claimed blocked or not.
  [[kind.setting]]
  name = "only_blocked"
  doc = "False claims only free cards, true only blocked ones, left out either"
  type = "bool"

  # The slots afkd runs, each passed the board the `key` and `base_url` settings build and its
  # card, the run first and the run's outcome last where there is one. `on_claim` runs before
  # there is a run, so it has none.
  [[kind.slot]]
  name = "on_run"
  doc = "Runs for a claimed card, and does the work on it"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "b"
    type = "Board"

    [[kind.slot.param]]
    name = "card"
    type = "Card"

  [[kind.slot]]
  name = "on_claim"
  doc = "Runs once a card is claimed, before the run starts"
  when = "pre"

    [[kind.slot.param]]
    name = "b"
    type = "Board"

    [[kind.slot.param]]
    name = "card"
    type = "Card"

  [[kind.slot]]
  name = "on_done"
  doc = "Runs after the run finished the card"
  when = "post"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "b"
    type = "Board"

    [[kind.slot.param]]
    name = "card"
    type = "Card"

    [[kind.slot.param]]
    name = "outcome"
    type = "afkd.Outcome"

  [[kind.slot]]
  name = "on_fail"
  doc = "Runs after the run failed on the card"
  when = "post"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "b"
    type = "Board"

    [[kind.slot.param]]
    name = "card"
    type = "Card"

    [[kind.slot.param]]
    name = "outcome"
    type = "afkd.Outcome"

  [[kind.slot]]
  name = "on_park"
  doc = "Runs after the run parked the card to wait"
  when = "post"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "b"
    type = "Board"

    [[kind.slot.param]]
    name = "card"
    type = "Card"

    [[kind.slot.param]]
    name = "outcome"
    type = "afkd.Outcome"

# The card of that number, archived or not.
[[action]]
name = "card"
doc = "Reads the card of a number, archived or not"
returns = "Card"

  [[action.param]]
  name = "b"
  doc = "The board to read"
  type = "Board"
  required = true

  [[action.param]]
  name = "number"
  doc = "The card's number"
  type = "int"
  required = true

# The cards every filter given keeps, in the board's order: by their list's place, then their
# place in it, archived cards after the others, the last archived first.
[[action]]
name = "cards"
doc = "Reads the cards every filter given keeps, in the board's order"
returns = "list[Card]"

  [[action.param]]
  name = "b"
  doc = "The board to read"
  type = "Board"
  required = true

  # A card in any of these lists, by name.
  [[action.param]]
  name = "list"
  doc = "Only cards in any of these lists, by name"
  type = "list[str]"
  named_only = true

  # A card carrying every one of these labels.
  [[action.param]]
  name = "labels"
  doc = "Only cards carrying every one of these labels"
  type = "list[str]"
  named_only = true

  # A card carrying none of these labels.
  [[action.param]]
  name = "without_labels"
  doc = "Only cards carrying none of these labels"
  type = "list[str]"
  named_only = true

  # true keeps the cards that are done, false those that are not; left out, both.
  [[action.param]]
  name = "done"
  doc = "True keeps the done cards, false the others, left out both"
  type = "bool?"
  named_only = true

  # true keeps the blocked cards, false the free ones; left out, both.
  [[action.param]]
  name = "blocked"
  doc = "True keeps the blocked cards, false the free ones, left out both"
  type = "bool?"
  named_only = true

  # In the title or the description, case aside.
  [[action.param]]
  name = "text"
  doc = "Only cards with this text in the title or description, any case"
  type = "str"
  named_only = true

  # Archived cards too.
  [[action.param]]
  name = "include_archived"
  doc = "Whether archived cards are kept too"
  type = "bool"
  named_only = true
  default = false

  # 1 to 250.
  [[action.param]]
  name = "limit"
  doc = "How many cards to read at most, 1 to 250"
  type = "int"
  named_only = true
  default = 50

# The card's comments, oldest first.
[[action]]
name = "comments"
doc = "Reads the card's comments, oldest first"
returns = "list[Comment]"

  [[action.param]]
  name = "b"
  doc = "The board the card is on"
  type = "Board"
  required = true

  [[action.param]]
  name = "card"
  doc = "The card whose comments to read"
  type = "Card"
  required = true

# The card's checklist: its items in the card's order, none when it has none.
[[action]]
name = "checklist"
doc = "Reads the card's checklist items in the card's order, none when it has none"
returns = "list[Item]"

  [[action.param]]
  name = "b"
  doc = "The board the card is on"
  type = "Board"
  required = true

  [[action.param]]
  name = "card"
  doc = "The card whose checklist to read"
  type = "Card"
  required = true

# The board's lists, in order.
[[action]]
name = "lists"
doc = "Reads the board's lists, in order"
returns = "list[List]"

  [[action.param]]
  name = "b"
  doc = "The board to read"
  type = "Board"
  required = true

# The board's labels.
[[action]]
name = "labels"
doc = "Reads the board's labels"
returns = "list[Label]"

  [[action.param]]
  name = "b"
  doc = "The board to read"
  type = "Board"
  required = true

# The writes. Every write of a card, of its checklist and of a comment takes `run`, the run it is
# made in, as a named-only `afkd.Run?`: the board shows the change under that run, and one
# made with none under the key's name. A write of a list takes none. A list is named by its
# name, matched exactly; a card is a `Card` handle of the board the `Board` reaches.

# A card with the board's next number, at the bottom of `list` unless `at` or `after` says.
[[action]]
name = "create_card"
doc = "Makes a card with the board's next number, at the bottom unless told"
returns = "Card"

  [[action.param]]
  name = "b"
  doc = "The board to write to"
  type = "Board"
  required = true

  # The list it goes in, by name.
  [[action.param]]
  name = "list"
  doc = "The name of the list it goes in"
  type = "str"
  required = true

  [[action.param]]
  name = "title"
  doc = "The card's title"
  type = "str"
  required = true

  # Markdown.
  [[action.param]]
  name = "description"
  doc = "The card's description in Markdown"
  type = "str"
  named_only = true

  # By name; one the board lacks is made in the next free colour.
  [[action.param]]
  name = "labels"
  doc = "The names of its labels, one the board lacks is made"
  type = "list[str]"
  named_only = true

  # Its items, none ticked: only each item's text is sent.
  [[action.param]]
  name = "checklist"
  doc = "Its checklist items, none ticked: only each text is sent"
  type = "list[Item]"
  named_only = true

  # The place in the list. Not with `after`.
  [[action.param]]
  name = "at"
  doc = "The place in the list, top or bottom, not with after"
  type = "enum"
  values = ["top", "bottom"]
  named_only = true

  # Right after this card, which is in the list. Not with `at`.
  [[action.param]]
  name = "after"
  doc = "The card in the list it goes right after, not with at"
  type = "Card?"
  named_only = true

  # The run it is made in.
  [[action.param]]
  name = "run"
  doc = "The run it is made in"
  type = "afkd.Run?"
  named_only = true

# The card with its title or its description changed.
[[action]]
name = "update_card"
doc = "Changes a card's title or description"
returns = "Card"

  [[action.param]]
  name = "b"
  doc = "The board the card is on"
  type = "Board"
  required = true

  [[action.param]]
  name = "card"
  doc = "The card to change"
  type = "Card"
  required = true

  [[action.param]]
  name = "title"
  doc = "The card's new title"
  type = "str"
  named_only = true

  # Markdown.
  [[action.param]]
  name = "description"
  doc = "The card's new description in Markdown"
  type = "str"
  named_only = true

  [[action.param]]
  name = "run"
  doc = "The run it is changed in"
  type = "afkd.Run?"
  named_only = true

# The card moved to `list`, at the bottom unless `at` or `after` says.
[[action]]
name = "move_card"
doc = "Moves a card to a list, at the bottom unless told"
returns = "Card"

  [[action.param]]
  name = "b"
  doc = "The board the card is on"
  type = "Board"
  required = true

  [[action.param]]
  name = "card"
  doc = "The card to move"
  type = "Card"
  required = true

  # By name.
  [[action.param]]
  name = "list"
  doc = "The name of the list to move it to"
  type = "str"
  required = true

  # The place in the list. Not with `after`.
  [[action.param]]
  name = "at"
  doc = "The place in the list, top or bottom, not with after"
  type = "enum"
  values = ["top", "bottom"]
  named_only = true

  # Right after this card, which is in the list. Not with `at`.
  [[action.param]]
  name = "after"
  doc = "The card in the list it goes right after, not with at"
  type = "Card?"
  named_only = true

  [[action.param]]
  name = "run"
  doc = "The run it is moved in"
  type = "afkd.Run?"
  named_only = true

# The card with the label put on; one the board lacks is made in the next free colour.
[[action]]
name = "add_label"
