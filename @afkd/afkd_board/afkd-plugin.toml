  type = "afkd.Run?"
  named_only = true

# The card deleted for good, with its checklist, its comments and its activity; it gives the card
# as it was read before. The board's API takes no run to delete a card, so `run` does not reach it.
[[action]]
name = "delete_card"
doc = "Deletes a card for good, giving the card as it was read before"
returns = "Card"

  [[action.param]]
  name = "b"
  doc = "The board the card is on"
  type = "Board"
  required = true

  [[action.param]]
  name = "card"
  doc = "The card to delete"
  type = "Card"
  required = true

  [[action.param]]
  name = "run"
  doc = "The run it is deleted in, which the board's API does not take"
  type = "afkd.Run?"
  named_only = true

# A list at the bottom of the board unless `at` or `after` says.
[[action]]
name = "create_list"
doc = "Makes a list, at the bottom of the board unless told"
returns = "List"

  [[action.param]]
  name = "b"
  doc = "The board to write to"
  type = "Board"
  required = true

  [[action.param]]
  name = "name"
  doc = "The list's name"
  type = "str"
  required = true

  # The place on the board. Not with `after`.
  [[action.param]]
  name = "at"
  doc = "The place on the board, top or bottom, not with after"
  type = "enum"
  values = ["top", "bottom"]
  named_only = true

  # Right after this list, by name. Not with `at`.
  [[action.param]]
  name = "after"
  doc = "The name of the list it goes right after, not with at"
  type = "str"
  named_only = true

# The list renamed, moved, or both.
[[action]]
name = "update_list"
doc = "Renames a list, moves it, or both"
returns = "List"

  [[action.param]]
  name = "b"
  doc = "The board the list is on"
  type = "Board"
  required = true

  # By name.
  [[action.param]]
  name = "list"
  doc = "The name of the list to change"
  type = "str"
  required = true

  [[action.param]]
  name = "name"
  doc = "The list's new name"
  type = "str"
  named_only = true

  # The place on the board. Not with `after`.
  [[action.param]]
  name = "at"
  doc = "The place on the board, top or bottom, not with after"
  type = "enum"
  values = ["top", "bottom"]
  named_only = true

  # Right after this list, by name. Not with `at`.
  [[action.param]]
  name = "after"
  doc = "The name of the list it goes right after, not with at"
  type = "str"
  named_only = true

# The list deleted with its archived cards. One holding cards that are not archived is refused,
# naming how many.
[[action]]
name = "delete_list"
doc = "Deletes a list with its archived cards, refusing one with live cards"

  [[action.param]]
  name = "b"
  doc = "The board the list is on"
  type = "Board"
  required = true

  # By name.
  [[action.param]]
  name = "list"
  doc = "The name of the list to delete"
  type = "str"
  required = true
