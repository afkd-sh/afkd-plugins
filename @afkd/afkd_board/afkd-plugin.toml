  type = "Board"
  required = true

  [[action.param]]
  name = "card"
  doc = "The card to take the label off"
  type = "Card"
  required = true

  # By name.
  [[action.param]]
  name = "label"
  doc = "The name of the label to take off"
  type = "str"
  required = true

  [[action.param]]
  name = "run"
  doc = "The run it is taken off in"
