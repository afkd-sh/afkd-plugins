name = "@afkd/afkd_board"
version = "0.2.0"
proto = 2
shape = "provider"
source = "https://github.com/afkd-sh/afkd-plugins"
exec = "afkd-afkd_board"

# The board a read reaches, by one of its API keys, made in its Board settings. A key reaches
# one board, so two boards are two values.
[[struct]]
name = "Board"

  # afk_board_…, which afkd never prints.
  [[struct.field]]
  name = "key"
  type = "str"
  secret = true

  # A stand-in's address, in tests.
  [[struct.field]]
  name = "base_url"
  type = "str"
  default = "https://app.afkd.sh"

# One item of a card's checklist.
[[struct]]
name = "Item"

  [[struct.field]]
  name = "text"
  type = "str"

  [[struct.field]]
  name = "done"
  type = "bool"

# A list of the board, read with the board.
[[struct]]
name = "List"

  [[struct.field]]
  name = "id"
  type = "str"

  [[struct.field]]
  name = "name"
  type = "str"

# A label of the board, read with the board.
[[struct]]
name = "Label"

  [[struct.field]]
  name = "name"
  type = "str"

  [[struct.field]]
  name = "colour"
  type = "str"

# A card. afkd carries `id`, the card's number as its digits (`17`), and `key`,
# `afkd_board:<board uuid>/<card uuid>`, which `==` compares. The fields below are the rest of what
# the plugin knows about a card. Every one is always sent, since a field left out is not
# delivered and a slot reading it would fail its run. A time is unix milliseconds.
[[handle]]
name = "Card"

  # 17 for #17.
  [[handle.field]]
  name = "number"
  type = "int"

  [[handle.field]]
  name = "title"
  type = "str"

  # Markdown, "" when it has none.
  [[handle.field]]
  name = "description"
  type = "str"

  # The name of the list it is in.
  [[handle.field]]
  name = "list"
  type = "str"

  # By name, in the order they were put on.
  [[handle.field]]
  name = "labels"
  type = "list[str]"

  [[handle.field]]
  name = "archived"
  type = "bool"

  [[handle.field]]
  name = "done"
  type = "bool"

  # The numbers of the cards it is blocked by, done or not, and of those it blocks.
  [[handle.field]]
  name = "blocked_by"
  type = "list[int]"

  [[handle.field]]
  name = "blocking"
  type = "list[int]"

  # Whether a card it is blocked by is not done.
  [[handle.field]]
  name = "blocked"
  type = "bool"

  [[handle.field]]
  name = "url"
  type = "str"

  [[handle.field]]
  name = "created_at"
  type = "time"

  # The newest of when it was made, its changes and its comments.
  [[handle.field]]
  name = "updated_at"
  type = "time"

# A comment on a card. afkd carries `id`, the comment's uuid, and `key`,
# `afkd_board:<board uuid>/<comment uuid>`.
[[handle]]
name = "Comment"

  # The number of the card it is on.
  [[handle.field]]
  name = "card"
  type = "int"

  [[handle.field]]
  name = "body"
  type = "str"

  # The name of the person who made it; nil for a comment a key made, and once the person's
  # account is deleted.
  [[handle.field]]
  name = "author"
  type = "str?"

  # The id of the run it was made in.
  [[handle.field]]
  name = "run"
  type = "str?"

  [[handle.field]]
  name = "created_at"
  type = "time"

  # Its card's url, since a comment has no address of its own.
  [[handle.field]]
  name = "url"
  type = "str"

# The card of that number, archived or not.
[[action]]
name = "card"
returns = "Card"

  [[action.param]]
  name = "b"
  type = "Board"
  required = true

  [[action.param]]
  name = "number"
  type = "int"
  required = true

# The cards every filter given keeps, in the board's order: by their list's place, then their
# place in it, archived cards after the others, the last archived first.
[[action]]
name = "cards"
returns = "list[Card]"

  [[action.param]]
  name = "b"
  type = "Board"
  required = true

  # A card in any of these lists, by name.
  [[action.param]]
  name = "list"
  type = "list[str]"
  named_only = true

  # A card carrying every one of these labels.
  [[action.param]]
  name = "labels"
  type = "list[str]"
  named_only = true

  # A card carrying none of these labels.
  [[action.param]]
  name = "without_labels"
  type = "list[str]"
  named_only = true

  # true keeps the cards that are done, false those that are not; left out, both.
  [[action.param]]
  name = "done"
  type = "bool?"
  named_only = true

  # true keeps the blocked cards, false the free ones; left out, both.
  [[action.param]]
  name = "blocked"
  type = "bool?"
  named_only = true

  # In the title or the description, case aside.
  [[action.param]]
  name = "text"
  type = "str"
  named_only = true

  # Archived cards too.
  [[action.param]]
  name = "include_archived"
  type = "bool"
  named_only = true
  default = false

  # 1 to 250.
  [[action.param]]
  name = "limit"
  type = "int"
  named_only = true
  default = 50

# The card's comments, oldest first.
[[action]]
name = "comments"
returns = "list[Comment]"

  [[action.param]]
  name = "b"
  type = "Board"
  required = true

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

# The board's lists, in order.
[[action]]
name = "lists"
returns = "list[List]"

  [[action.param]]
  name = "b"
  type = "Board"
  required = true

# The board's labels.
[[action]]
name = "labels"
returns = "list[Label]"

  [[action.param]]
  name = "b"
  type = "Board"
  required = true

# The writes. Every write of a card, of its checklist and of a comment takes `run`, the run it is
# made in, as a named-only `afkd.Run?`: the board shows the change under that run, and one
# made with none under the key's name. A write of a list takes none. A list is named by its
# name, matched exactly; a card is a `Card` handle of the board the `Board` reaches.

# A card with the board's next number, at the bottom of `list` unless `at` or `after` says.
[[action]]
name = "create_card"
returns = "Card"

  [[action.param]]
  name = "b"
  type = "Board"
  required = true

  # The list it goes in, by name.
  [[action.param]]
  name = "list"
  type = "str"
  required = true

  [[action.param]]
  name = "title"
  type = "str"
  required = true

  # Markdown.
  [[action.param]]
  name = "description"
  type = "str"
  named_only = true

  # By name; one the board lacks is made in the next free colour.
  [[action.param]]
  name = "labels"
  type = "list[str]"
  named_only = true

  # Its items, none ticked: only each item's text is sent.
  [[action.param]]
  name = "checklist"
  type = "list[Item]"
  named_only = true

  # The place in the list. Not with `after`.
  [[action.param]]
  name = "at"
  type = "enum"
  values = ["top", "bottom"]
  named_only = true

  # Right after this card, which is in the list. Not with `at`.
  [[action.param]]
  name = "after"
  type = "Card?"
  named_only = true

  # The run it is made in.
  [[action.param]]
  name = "run"
  type = "afkd.Run?"
  named_only = true

# The card with its title or its description changed.
[[action]]
name = "update_card"
returns = "Card"

  [[action.param]]
  name = "b"
  type = "Board"
  required = true

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  [[action.param]]
  name = "title"
  type = "str"
  named_only = true

  # Markdown.
  [[action.param]]
  name = "description"
  type = "str"
  named_only = true

  [[action.param]]
  name = "run"
  type = "afkd.Run?"
  named_only = true

# The card moved to `list`, at the bottom unless `at` or `after` says.
[[action]]
name = "move_card"
returns = "Card"

  [[action.param]]
  name = "b"
  type = "Board"
  required = true

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  # By name.
  [[action.param]]
  name = "list"
  type = "str"
  required = true

  # The place in the list. Not with `after`.
  [[action.param]]
  name = "at"
  type = "enum"
  values = ["top", "bottom"]
  named_only = true

  # Right after this card, which is in the list. Not with `at`.
  [[action.param]]
  name = "after"
  type = "Card?"
  named_only = true

  [[action.param]]
  name = "run"
  type = "afkd.Run?"
  named_only = true

# The card with the label put on; one the board lacks is made in the next free colour.
[[action]]
name = "add_label"
returns = "Card"

  [[action.param]]
  name = "b"
  type = "Board"
  required = true

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  # By name.
  [[action.param]]
  name = "label"
  type = "str"
  required = true

  [[action.param]]
  name = "run"
  type = "afkd.Run?"
  named_only = true

# The card with the label taken off. A label the card lacks, or the board does, leaves it as it
# is, and writes nothing.
[[action]]
name = "remove_label"
returns = "Card"

  [[action.param]]
  name = "b"
  type = "Board"
  required = true

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  # By name.
  [[action.param]]
  name = "label"
  type = "str"
  required = true

  [[action.param]]
  name = "run"
  type = "afkd.Run?"
  named_only = true

# The card with an item added to the end of its checklist, not ticked.
[[action]]
name = "add_item"
returns = "Card"

  [[action.param]]
  name = "b"
  type = "Board"
  required = true

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  [[action.param]]
  name = "text"
  type = "str"
  required = true

  [[action.param]]
  name = "run"
  type = "afkd.Run?"
  named_only = true

# The card with its checklist's item ticked, or unticked.
[[action]]
name = "check_item"
returns = "Card"

  [[action.param]]
  name = "b"
  type = "Board"
  required = true

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  # The item's place in its checklist, from 0.
  [[action.param]]
  name = "index"
  type = "int"
  required = true

  # true ticks it, false unticks it.
  [[action.param]]
  name = "done"
  type = "bool"
  default = true

  [[action.param]]
  name = "run"
  type = "afkd.Run?"
  named_only = true

# The card with its checklist's item removed, the items after it moving up one.
[[action]]
name = "remove_item"
returns = "Card"

  [[action.param]]
  name = "b"
  type = "Board"
  required = true

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  # The item's place in its checklist, from 0.
  [[action.param]]
  name = "index"
  type = "int"
  required = true

  [[action.param]]
  name = "run"
  type = "afkd.Run?"
  named_only = true

# The card marked done, or not. A blocked card is refused, naming the cards that are not done.
[[action]]
name = "mark_done"
returns = "Card"

  [[action.param]]
  name = "b"
  type = "Board"
  required = true

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  # true marks it done, false not.
  [[action.param]]
  name = "done"
  type = "bool"
  default = true

  [[action.param]]
  name = "run"
  type = "afkd.Run?"
  named_only = true

# The card blocked by `other`, with `done` as the board left it. A block that makes a chain back
# is refused, naming the chain.
[[action]]
name = "add_blocked_by"
returns = "Card"

  [[action.param]]
  name = "b"
  type = "Board"
  required = true

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  [[action.param]]
  name = "other"
  type = "Card"
  required = true

  [[action.param]]
  name = "run"
  type = "afkd.Run?"
  named_only = true

# The card with its block by `other` taken off.
[[action]]
name = "remove_blocked_by"
returns = "Card"

  [[action.param]]
  name = "b"
  type = "Board"
  required = true

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  [[action.param]]
  name = "other"
  type = "Card"
  required = true

  [[action.param]]
  name = "run"
  type = "afkd.Run?"
  named_only = true

# A comment on the card.
[[action]]
name = "create_comment"
returns = "Comment"

  [[action.param]]
  name = "b"
  type = "Board"
  required = true

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  # Markdown, 1 to 10 000 characters.
  [[action.param]]
  name = "body"
  type = "str"
  required = true

  [[action.param]]
  name = "run"
  type = "afkd.Run?"
  named_only = true

# The card archived, which leaves its list.
[[action]]
name = "archive_card"
returns = "Card"

  [[action.param]]
  name = "b"
  type = "Board"
  required = true

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  [[action.param]]
  name = "run"
  type = "afkd.Run?"
  named_only = true

# The archived card brought back to the bottom of its list.
[[action]]
name = "unarchive_card"
returns = "Card"

  [[action.param]]
  name = "b"
  type = "Board"
  required = true

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  [[action.param]]
  name = "run"
  type = "afkd.Run?"
  named_only = true

# The card deleted for good, with its checklist, its comments and its activity; it gives the card
# as it was read before. The board's API takes no run to delete a card, so `run` does not reach it.
[[action]]
name = "delete_card"
returns = "Card"

  [[action.param]]
  name = "b"
  type = "Board"
  required = true

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  [[action.param]]
  name = "run"
  type = "afkd.Run?"
  named_only = true

# A list at the bottom of the board unless `at` or `after` says.
[[action]]
name = "create_list"
returns = "List"

  [[action.param]]
  name = "b"
  type = "Board"
  required = true

  [[action.param]]
  name = "name"
  type = "str"
  required = true

  # The place on the board. Not with `after`.
  [[action.param]]
  name = "at"
  type = "enum"
  values = ["top", "bottom"]
  named_only = true

  # Right after this list, by name. Not with `at`.
  [[action.param]]
  name = "after"
  type = "str"
  named_only = true

# The list renamed, moved, or both.
[[action]]
name = "update_list"
returns = "List"

  [[action.param]]
  name = "b"
  type = "Board"
  required = true

  # By name.
  [[action.param]]
  name = "list"
  type = "str"
  required = true

  [[action.param]]
  name = "name"
  type = "str"
  named_only = true

  # The place on the board. Not with `after`.
  [[action.param]]
  name = "at"
  type = "enum"
  values = ["top", "bottom"]
  named_only = true

  # Right after this list, by name. Not with `at`.
  [[action.param]]
  name = "after"
  type = "str"
  named_only = true

# The list deleted with its archived cards. One holding cards that are not archived is refused,
# naming how many.
[[action]]
name = "delete_list"

  [[action.param]]
  name = "b"
  type = "Board"
  required = true

  # By name.
  [[action.param]]
  name = "list"
  type = "str"
  required = true
