name = "@afkd/gitlab"
version = "0.14.0"
proto = 2
shape = "provider"
source = "https://github.com/afkd-sh/afkd-plugins"
exec = "afkd-gitlab"

# The items a run claims, one handle type per kind: every slot of the kind is passed its
# item, and every action on it takes it first. afkd carries `id` (the number) and `key`
# (afkd's claim key) for every handle; the fields below are the rest of what the plugin
# knows about the item.
[[handle]]
name = "Issue"

  [[handle.field]]
  name = "title"
  doc = "The issue's title"
  type = "str"

  [[handle.field]]
  name = "url"
  doc = "The link to the issue on GitLab"
  type = "str"

  [[handle.field]]
  name = "number"
  doc = "The issue's number in the project"
  type = "int"

  [[handle.field]]
  name = "labels"
  doc = "The names of the issue's labels, before the claim's own changes"
  type = "list[str]"

[[handle]]
name = "Merge_Request"

  [[handle.field]]
  name = "title"
  doc = "The merge request's title"
  type = "str"

  [[handle.field]]
  name = "url"
  doc = "The link to the merge request on GitLab"
  type = "str"

  [[handle.field]]
  name = "number"
  doc = "The merge request's number in the project"
  type = "int"

  [[handle.field]]
  name = "branch"
  doc = "The merge request's source branch"
  type = "str"

# The issue kind, `service(gitlab)` in a config: a project's issues, claimed one per run.
[[kind]]
name = "issue"
doc = "A project's issues, claimed one per run"
role = "trigger"
main = true
claims = true

  [[kind.setting]]
  name = "base_url"
  doc = "The GitLab address, when not https://gitlab.com"
  type = "str"

  [[kind.setting]]
  name = "project"
  doc = "The project to take issues from, by id or group/name"
  type = "str"

  [[kind.setting]]
  name = "token"
  doc = "The access token the plugin acts with"
  type = "str"
  required = true

  [[kind.setting]]
  name = "source_label"
  doc = "Only issues with this label"
  type = "str"

  # These two afkd reads itself, as it declares them for every claiming kind.
  [[kind.setting]]
  name = "max_attempts"
  doc = "How many times an issue is tried"
  type = "int"
  default = 1

  [[kind.setting]]
  name = "every"
  doc = "How often to look for an issue"
  type = "duration"
  jitter = true
  default = "30s"

  # The slots afkd runs, each passed the run and its issue, and after the run its
  # outcome; each action a slot calls is one `call` to this plugin.
  [[kind.slot]]
  name = "on_run"
  doc = "Runs for a claimed issue, and does the work on it"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "issue"
    type = "Issue"

  [[kind.slot]]
  name = "on_claim"
  doc = "Runs once an issue is claimed, before the run starts"
  when = "pre"

    [[kind.slot.param]]
    name = "issue"
    type = "Issue"

  [[kind.slot]]
  name = "on_done"
  doc = "Runs after the run finished the issue"
  when = "post"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "issue"
    type = "Issue"

    [[kind.slot.param]]
    name = "outcome"
    type = "afkd.Outcome"

  [[kind.slot]]
  name = "on_fail"
  doc = "Runs after the run failed on the issue"
  when = "post"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "issue"
    type = "Issue"

    [[kind.slot.param]]
    name = "outcome"
    type = "afkd.Outcome"

# The merge-request kind, `service(gitlab.mr)` in a config: the review loop over a
# project's merge requests. It has `author_me` in place of `source_label`.
[[kind]]
name = "mr"
doc = "A project's merge requests, reviewed one per run"
role = "trigger"
claims = true

  [[kind.setting]]
  name = "base_url"
  doc = "The GitLab address, when not https://gitlab.com"
  type = "str"

  [[kind.setting]]
  name = "project"
  doc = "The project to take merge requests from, by id or group/name"
  type = "str"

  [[kind.setting]]
  name = "token"
  doc = "The access token the plugin acts with"
  type = "str"
  required = true

  [[kind.setting]]
  name = "author_me"
  doc = "Only merge requests the token's own user opened"
  type = "bool"
  default = false

  # These two afkd reads itself, as it declares them for every claiming kind.
  [[kind.setting]]
  name = "max_attempts"
  doc = "How many times a merge request is tried"
  type = "int"
  default = 1

  [[kind.setting]]
  name = "every"
  doc = "How often to look for a merge request"
  type = "duration"
  jitter = true
  default = "30s"

  # The slots afkd runs, each passed the run and its merge request, and after the run its
  # outcome; each action a slot calls is one `call` to this plugin.
  [[kind.slot]]
  name = "on_run"
  doc = "Runs for a claimed merge request, and does the work on it"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "mr"
    type = "Merge_Request"

  [[kind.slot]]
  name = "on_claim"
  doc = "Runs once a merge request is claimed, before the run starts"
  when = "pre"

    [[kind.slot.param]]
    name = "mr"
    type = "Merge_Request"

  [[kind.slot]]
  name = "on_done"
  doc = "Runs after the run finished the merge request"
  when = "post"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "mr"
    type = "Merge_Request"

    [[kind.slot.param]]
    name = "outcome"
    type = "afkd.Outcome"

  [[kind.slot]]
  name = "on_fail"
  doc = "Runs after the run failed on the merge request"
  when = "post"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "mr"
    type = "Merge_Request"

    [[kind.slot.param]]
    name = "outcome"
    type = "afkd.Outcome"

# The actions a slot of the issue kind calls, each on the issue it is passed first.
[[action]]
name = "assign_me"
doc = "Adds the token's own user to the issue's assignees"

  [[action.param]]
  name = "issue"
  doc = "The issue to assign"
  type = "Issue"
  required = true

[[action]]
name = "unassign"
doc = "Takes only the token's own user off the issue's assignees"

  [[action.param]]
  name = "issue"
  doc = "The issue to unassign"
  type = "Issue"
  required = true

[[action]]
name = "add_label"
doc = "Puts a label on the issue"

  [[action.param]]
  name = "issue"
  doc = "The issue to label"
  type = "Issue"
  required = true

  [[action.param]]
  name = "label"
  doc = "The name of the label to add"
  type = "str"
  required = true

[[action]]
name = "remove_label"
doc = "Takes a label off the issue"

  [[action.param]]
  name = "issue"
  doc = "The issue to take the label off"
  type = "Issue"
  required = true

  [[action.param]]
  name = "label"
  doc = "The name of the label to remove"
  type = "str"
  required = true

[[action]]
name = "close"
doc = "Closes the issue"

  [[action.param]]
  name = "issue"
  doc = "The issue to close"
  type = "Issue"
  required = true

[[action]]
name = "comment"
doc = "Writes a comment on the issue"

  [[action.param]]
  name = "issue"
  doc = "The issue to comment on"
  type = "Issue"
  required = true

  [[action.param]]
  name = "text"
  doc = "The text of the comment"
  type = "str"
  required = true

# The same six for a slot of the mr kind, each on the merge request it is passed first: a
# config's types have no subtyping, so one action cannot take both kinds' items.
[[action]]
name = "mr_assign_me"
doc = "Adds the token's own user to the merge request's assignees"

  [[action.param]]
  name = "mr"
  doc = "The merge request to assign"
  type = "Merge_Request"
  required = true

[[action]]
name = "mr_unassign"
doc = "Takes only the token's own user off the assignees"

  [[action.param]]
  name = "mr"
  doc = "The merge request to unassign"
  type = "Merge_Request"
  required = true

[[action]]
name = "mr_add_label"
doc = "Puts a label on the merge request"

  [[action.param]]
  name = "mr"
  doc = "The merge request to label"
  type = "Merge_Request"
  required = true

  [[action.param]]
  name = "label"
  doc = "The name of the label to add"
  type = "str"
  required = true

[[action]]
name = "mr_remove_label"
doc = "Takes a label off the merge request"

  [[action.param]]
  name = "mr"
  doc = "The merge request to take the label off"
  type = "Merge_Request"
  required = true

  [[action.param]]
  name = "label"
  doc = "The name of the label to remove"
  type = "str"
  required = true

[[action]]
name = "mr_close"
doc = "Closes the merge request"

  [[action.param]]
  name = "mr"
  doc = "The merge request to close"
  type = "Merge_Request"
  required = true

[[action]]
name = "mr_comment"
doc = "Writes a comment on the merge request"

  [[action.param]]
  name = "mr"
  doc = "The merge request to comment on"
  type = "Merge_Request"
  required = true

  [[action.param]]
  name = "text"
  doc = "The text of the comment"
  type = "str"
  required = true
