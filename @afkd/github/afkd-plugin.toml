name = "@afkd/github"
version = "0.1.0"
proto = 1
shape = "provider"
source = "https://github.com/afkd-sh/afkd-plugins"
build = "cargo build --release --locked"
exec = "target/release/afkd-github"

# The issue kind: the vocabulary of afkd's retired built-in GitHub issue trigger, key for key.
[[trigger]]
kind = "github_issue"
settings = [
  "host",
  "repo",
  "token",
  "source_label",
  "follow_comments",
  "max_attempts",
  "poll_interval",
  "on_claim",
  "on_done",
  "on_fail",
]
required = ["token"]
repeatable = []
durations = ["poll_interval", "follow_comments"]
run_kind = "issue"
display_name = "GitHub issues"
info_keys = []

[[trigger.block]]
path = "on_claim"
settings = ["assign_me", "unassign", "label_add", "label_remove", "close", "comment"]
repeatable = ["assign_me", "unassign", "label_add", "label_remove", "close", "comment"]

[[trigger.block]]
path = "on_done"
settings = ["assign_me", "unassign", "label_add", "label_remove", "close", "comment"]
repeatable = ["assign_me", "unassign", "label_add", "label_remove", "close", "comment"]

[[trigger.block]]
path = "on_fail"
settings = ["assign_me", "unassign", "label_add", "label_remove", "close", "comment"]
repeatable = ["assign_me", "unassign", "label_add", "label_remove", "close", "comment"]

# The pull-request kind: the retired built-in GitHub PR trigger's vocabulary, key for key —
# the issue kind's keys with `author_me` in place of `source_label`, and the same three
# lifecycle blocks (GitHub has no `on_park`).
[[trigger]]
kind = "github_pr"
settings = [
  "host",
  "repo",
  "token",
  "author_me",
  "follow_comments",
  "max_attempts",
  "poll_interval",
  "on_claim",
  "on_done",
  "on_fail",
]
required = ["token"]
repeatable = []
durations = ["poll_interval", "follow_comments"]
run_kind = "pr"
display_name = "GitHub PRs"
info_keys = []

[[trigger.block]]
path = "on_claim"
settings = ["assign_me", "unassign", "label_add", "label_remove", "close", "comment"]
repeatable = ["assign_me", "unassign", "label_add", "label_remove", "close", "comment"]

[[trigger.block]]
path = "on_done"
settings = ["assign_me", "unassign", "label_add", "label_remove", "close", "comment"]
repeatable = ["assign_me", "unassign", "label_add", "label_remove", "close", "comment"]

[[trigger.block]]
path = "on_fail"
settings = ["assign_me", "unassign", "label_add", "label_remove", "close", "comment"]
repeatable = ["assign_me", "unassign", "label_add", "label_remove", "close", "comment"]
