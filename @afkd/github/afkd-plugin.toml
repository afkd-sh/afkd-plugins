name = "@afkd/github"
version = "0.2.0"
proto = 2
shape = "provider"
source = "https://github.com/afkd-sh/afkd-plugins"
build = "cargo build --release --locked"
exec = "target/release/afkd-github"

# The issue kind, `service(github)` in a config: a repository's issues, claimed one per run.
[[kind]]
name = "issue"
role = "trigger"
main = true
claims = true

  [[kind.setting]]
  name = "host"
  type = "string"

  [[kind.setting]]
  name = "repo"
  type = "string"

  [[kind.setting]]
  name = "token"
  type = "string"
  required = true

  [[kind.setting]]
  name = "source_label"
  type = "string"

  # These three afkd reads itself, as it declares them for every claiming kind.
  [[kind.setting]]
  name = "follow_comments"
  type = "duration"
  jitter = true

  [[kind.setting]]
  name = "max_attempts"
  type = "int"
  default = 1

  [[kind.setting]]
  name = "poll_interval"
  type = "duration"
  jitter = true
  default = "30s"

  # afkd runs the hooks; each action one of them calls is one `call` to this plugin.
  [[kind.hook]]
  name = "on_claim"
  when = "pre"

  [[kind.hook]]
  name = "on_done"
  when = "post"

  [[kind.hook]]
  name = "on_fail"
  when = "post"

# The pull-request kind, `service(github.pr)` in a config: the review loop over a
# repository's pull requests. It has `author_me` in place of `source_label`.
[[kind]]
name = "pr"
role = "trigger"
claims = true

  [[kind.setting]]
  name = "host"
  type = "string"

  [[kind.setting]]
  name = "repo"
  type = "string"

  [[kind.setting]]
  name = "token"
  type = "string"
  required = true

  [[kind.setting]]
  name = "author_me"
  type = "bool"
  default = false

  # These three afkd reads itself, as it declares them for every claiming kind.
  [[kind.setting]]
  name = "follow_comments"
  type = "duration"
  jitter = true

  [[kind.setting]]
  name = "max_attempts"
  type = "int"
  default = 1

  [[kind.setting]]
  name = "poll_interval"
  type = "duration"
  jitter = true
  default = "30s"

  [[kind.hook]]
  name = "on_claim"
  when = "pre"

  [[kind.hook]]
  name = "on_done"
  when = "post"

  [[kind.hook]]
  name = "on_fail"
  when = "post"

# The actions a hook calls, each on the claimed issue or pull request.
[[action]]
name = "assign_me"

[[action]]
name = "unassign"

[[action]]
name = "label_add"

  [[action.param]]
  name = "label"
  type = "string"
  required = true

[[action]]
name = "label_remove"

  [[action.param]]
  name = "label"
  type = "string"
  required = true

[[action]]
name = "close"

[[action]]
name = "comment"

  [[action.param]]
  name = "text"
  type = "string"
  required = true

# `github.me`: the login the token authenticates as, for a hook's comment or label.
[[value]]
name = "me"
type = "string"
