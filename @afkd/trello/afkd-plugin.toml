  [[action.param]]
  name = "acct"
  doc = "The account to reach Trello through"
  type = "Account"
  required = true

  [[action.param]]
  name = "card"
  doc = "The card to put the checklist on"
  type = "Card"
  required = true

  [[action.param]]
  name = "name"
  doc = "The checklist's name"
  type = "str"
  required = true

  [[action.param]]
  name = "items"
  doc = "The names of the checklist's items, in order"
  type = "list[str]"
  named_only = true

[[action]]
name = "delete_checklist"
doc = "Deletes a checklist with its items"

  [[action.param]]
  name = "acct"
  doc = "The account to reach Trello through"
  type = "Account"
  required = true

  [[action.param]]
  name = "checklist"
  doc = "The checklist to delete"
  type = "Checklist"
  required = true

[[action]]
