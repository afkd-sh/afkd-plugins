name = "@afkd/trello"
version = "0.3.0"
proto = 2
shape = "provider"
source = "https://github.com/afkd-sh/afkd-plugins"
build = "cargo build --release --locked"
exec = "target/release/afkd-trello"

# The item a run claims, `trello.Card` in a config: every slot is passed it, and every
# action takes it first. afkd carries `id` (the short link) and `key` (afkd's claim key)
# for every handle; the fields below are the rest of what the plugin knows about a card.
[[handle]]
name = "Card"

  [[handle.field]]
  name = "title"
  type = "string"

  [[handle.field]]
  name = "url"
  type = "string"

  [[handle.field]]
  name = "labels"
  type = "list[string]"

# The one kind, `service(trello)` in a config: a Trello board whose cards are claimed one
# per run.
[[kind]]
name = "card"
role = "trigger"
main = true
claims = true

  [[kind.setting]]
  name = "board"
  type = "string"
  required = true

  [[kind.setting]]
  name = "base_url"
  type = "string"

  [[kind.setting]]
  name = "api_key"
  type = "string"
  required = true

  [[kind.setting]]
  name = "token"
  type = "string"
  required = true

  [[kind.setting]]
  name = "pick_from"
  type = "string"

  [[kind.setting]]
  name = "require_member"
  type = "string"

  [[kind.setting]]
  name = "require_label"
  type = "string"

  [[kind.setting]]
  name = "without_label"
  type = "list[string]"

  [[kind.setting]]
  name = "discuss_with"
  type = "list[string]"

  # A threshold, so no range: it is not resampled per read.
  [[kind.setting]]
  name = "min_age"
  type = "duration"

  # These three afkd reads itself, as it declares them for every claiming kind.
  [[kind.setting]]
  name = "follow_comments"
  type = "duration"
  jitter = true

  [[kind.setting]]
  name = "max_attempts"
  type = "int"
  default = 1

  [[kind.setting]]
  name = "poll_interval"
  type = "duration"
  jitter = true
  default = "30s"

  # The slots afkd runs, each passed the run and its card, and after the run its outcome;
  # each action a slot calls is one `call` to this plugin.
  [[kind.slot]]
  name = "on_run"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "card"
    type = "Card"

  [[kind.slot]]
  name = "on_claim"
  when = "pre"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "card"
    type = "Card"

  [[kind.slot]]
  name = "on_done"
  when = "post"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "card"
    type = "Card"

    [[kind.slot.param]]
    name = "outcome"
    type = "afkd.Outcome"

  [[kind.slot]]
  name = "on_fail"
  when = "post"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "card"
    type = "Card"

    [[kind.slot.param]]
    name = "outcome"
    type = "afkd.Outcome"

  [[kind.slot]]
  name = "on_park"
  when = "post"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "card"
    type = "Card"

    [[kind.slot.param]]
    name = "outcome"
    type = "afkd.Outcome"

# The actions a slot calls, each on the card it is passed first.
[[action]]
name = "mark_complete"

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

[[action]]
name = "archive"

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

[[action]]
name = "move_to"

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  [[action.param]]
  name = "list"
  type = "string"
  required = true

  [[action.param]]
  name = "at"
  type = "enum"
  values = ["top", "bottom"]
  named_only = true
  default = "top"

[[action]]
name = "add_label"

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  [[action.param]]
  name = "label"
  type = "string"
  required = true

[[action]]
name = "remove_label"

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  [[action.param]]
  name = "label"
  type = "string"
  required = true

[[action]]
name = "add_member"

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  [[action.param]]
  name = "member"
  type = "string"
  required = true

[[action]]
name = "remove_member"

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  [[action.param]]
  name = "member"
  type = "string"
  required = true

[[action]]
name = "comment"

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  [[action.param]]
  name = "text"
  type = "string"
  required = true

# `trello.me`: the member the credentials authenticate as, for a member action or setting.
[[value]]
name = "me"
type = "string"
