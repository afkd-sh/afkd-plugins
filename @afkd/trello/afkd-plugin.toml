name = "@afkd/trello"
version = "0.11.0"
proto = 2
shape = "provider"
source = "https://github.com/afkd-sh/afkd-plugins"
exec = "afkd-trello"

# The item a run claims, `trello.Card` in a config: every slot is passed it, and every
# action takes it first. afkd carries `id` (the short link) and `key` (afkd's claim key)
# for every handle; the fields below are the rest of what the plugin knows about a card.
[[handle]]
name = "Card"

  [[handle.field]]
  name = "title"
  type = "str"

  [[handle.field]]
  name = "url"
  type = "str"

  [[handle.field]]
  name = "labels"
  type = "list[str]"

# The one kind, `service(trello)` in a config: a Trello board whose cards are claimed one
# per run.
[[kind]]
name = "card"
role = "trigger"
main = true
claims = true

  [[kind.setting]]
  name = "board"
  type = "str"
  required = true

  [[kind.setting]]
  name = "base_url"
  type = "str"

  [[kind.setting]]
  name = "api_key"
  type = "str"
  required = true

  [[kind.setting]]
  name = "token"
  type = "str"
  required = true

  [[kind.setting]]
  name = "pick_from"
  type = "list[str]"
  required = true

  [[kind.setting]]
  name = "require_member"
  type = "str"

  [[kind.setting]]
  name = "require_label"
  type = "str"

  [[kind.setting]]
  name = "without_label"
  type = "list[str]"

  [[kind.setting]]
  name = "discuss_with"
  type = "list[str]"

  # A threshold, so no range: it is not resampled per read.
  [[kind.setting]]
  name = "min_age"
  type = "duration"

  # These two afkd reads itself, as it declares them for every claiming kind.
  [[kind.setting]]
  name = "max_attempts"
  type = "int"
  default = 1

  [[kind.setting]]
  name = "every"
  type = "duration"
  jitter = true
  default = "30s"

  # The slots afkd runs, each passed the run and its card, and after the run its outcome;
  # each action a slot calls is one `call` to this plugin.
  [[kind.slot]]
  name = "on_run"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "card"
    type = "Card"

  [[kind.slot]]
  name = "on_claim"
  when = "pre"

    [[kind.slot.param]]
    name = "card"
    type = "Card"

  [[kind.slot]]
  name = "on_done"
  when = "post"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "card"
    type = "Card"

    [[kind.slot.param]]
    name = "outcome"
    type = "afkd.Outcome"

  [[kind.slot]]
  name = "on_fail"
  when = "post"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "card"
    type = "Card"

    [[kind.slot.param]]
    name = "outcome"
    type = "afkd.Outcome"

  [[kind.slot]]
  name = "on_park"
  when = "post"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "card"
    type = "Card"

    [[kind.slot.param]]
    name = "outcome"
    type = "afkd.Outcome"

# The actions a slot calls, each on the card it is passed first.
[[action]]
name = "mark_complete"

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

[[action]]
name = "archive"

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

[[action]]
name = "move_to"

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  [[action.param]]
  name = "list"
  type = "str"
  required = true

  [[action.param]]
  name = "at"
  type = "enum"
  values = ["top", "bottom"]
  named_only = true
  default = "top"

[[action]]
name = "add_label"

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  [[action.param]]
  name = "label"
  type = "str"
  required = true

[[action]]
name = "remove_label"

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  [[action.param]]
  name = "label"
  type = "str"
  required = true

[[action]]
name = "add_member"

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  # A username, or "me": Trello's own alias for the member the credentials authenticate as.
  [[action.param]]
  name = "member"
  type = "str"
  default = "me"

[[action]]
name = "remove_member"

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  # A username, or "me": Trello's own alias for the member the credentials authenticate as.
  [[action.param]]
  name = "member"
  type = "str"
  default = "me"

[[action]]
name = "comment"

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  [[action.param]]
  name = "text"
  type = "str"
  required = true

# A file on the card: the one at `path`, absolute, read when the action is called and
# uploaded as `name`; queued and retried like every write when Trello is down.
[[action]]
name = "attach"

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  [[action.param]]
  name = "path"
  type = "str"
  required = true

  [[action.param]]
  name = "name"
  type = "str"
  required = true

# The newest file on the card named `name`, written to the absolute path `to`; nothing is
# written when there is none. A read, never queued.
[[action]]
name = "fetch_attachment"

  [[action.param]]
  name = "card"
  type = "Card"
  required = true

  [[action.param]]
  name = "name"
  type = "str"
  required = true

  [[action.param]]
  name = "to"
  type = "str"
  required = true
