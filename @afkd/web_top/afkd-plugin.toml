name = "@afkd/web_top"
version = "0.15.1"
proto = 2
shape = "companion"
source = "https://github.com/afkd-sh/afkd-plugins"
exec = "web_top"

[[config.setting]]
name = "listen"
doc = "The address the dashboard is served on, as host or host:port"
type = "str"
default = "127.0.0.1:8771"

# No default: the relay derives it from the socket afkd hands it, `<dir of socket>/runs`,
# which a static default cannot say. It is the kept root; a run in flight is read off
# `$TMPDIR/afkd/runs`, which no setting moves.
[[config.setting]]
name = "runs_dir"
doc = "Where the daemon keeps its runs, read for a run view"
type = "str"

[[config.setting]]
name = "max_clients"
doc = "How many browsers may be attached at once"
type = "int"
default = 8

[[config.setting]]
name = "log_lines"
doc = "How many log lines the page keeps per service"
type = "int"
default = 2000
