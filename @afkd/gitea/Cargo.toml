[package]
name = "afkd-gitea"
version = "0.1.0"
edition = "2021"
publish = false
description = "The @afkd/gitea trigger plugin: Gitea issues and pull-request reviews as afkd units, over the plugin wire"

[[bin]]
name = "afkd-gitea"
path = "src/main.rs"

# Three dependencies and no afkd crate: afkd's crates are unpublished, and this builds on an
# operator's host at `afkd install` time.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"

# Its own workspace, so the repository's root workspace (the drift gates) never captures it
# and `target/` lands inside the plugin directory, where `exec` expects it.
[workspace]
