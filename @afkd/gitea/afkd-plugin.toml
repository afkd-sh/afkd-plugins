name = "@afkd/gitea"
version = "0.4.0"
proto = 2
shape = "provider"
source = "https://github.com/afkd-sh/afkd-plugins"
build = "cargo build --release --locked"
exec = "target/release/afkd-gitea"

# The items a run claims, one handle type per kind: every slot of the kind is passed its
# item, and every action on it takes it first. afkd carries `id` (the number) and `key`
# (afkd's claim key) for every handle; the fields below are the rest of what the plugin
# knows about the item.
[[handle]]
name = "Issue"

  [[handle.field]]
  name = "title"
  type = "string"

  [[handle.field]]
  name = "url"
  type = "string"

  [[handle.field]]
  name = "number"
  type = "int"

  [[handle.field]]
  name = "labels"
  type = "list[string]"

[[handle]]
name = "Pull_Request"

  [[handle.field]]
  name = "title"
  type = "string"

  [[handle.field]]
  name = "url"
  type = "string"

  [[handle.field]]
  name = "number"
  type = "int"

  [[handle.field]]
  name = "branch"
  type = "string"

# The issue kind, `service(gitea)` in a config: a repository's (or an org's) issues, claimed
# one per run.
[[kind]]
name = "issue"
role = "trigger"
main = true
claims = true

  [[kind.setting]]
  name = "base_url"
  type = "string"

  [[kind.setting]]
  name = "repo"
  type = "string"

  [[kind.setting]]
  name = "org"
  type = "string"

  [[kind.setting]]
  name = "token"
  type = "string"
  required = true

  [[kind.setting]]
  name = "source_label"
  type = "string"

  [[kind.setting]]
  name = "discuss_with"
  type = "list[string]"

  # These three afkd reads itself, as it declares them for every claiming kind.
  [[kind.setting]]
  name = "follow_comments"
  type = "duration"
  jitter = true

  [[kind.setting]]
  name = "max_attempts"
  type = "int"
  default = 1

  [[kind.setting]]
  name = "poll_interval"
  type = "duration"
  jitter = true
  default = "30s"

  # The slots afkd runs, each passed the run and its issue, and after the run its
  # outcome; each action a slot calls is one `call` to this plugin.
  [[kind.slot]]
  name = "on_run"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "issue"
    type = "Issue"

  [[kind.slot]]
  name = "on_claim"
  when = "pre"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "issue"
    type = "Issue"

  [[kind.slot]]
  name = "on_done"
  when = "post"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "issue"
    type = "Issue"

    [[kind.slot.param]]
    name = "outcome"
    type = "afkd.Outcome"

  [[kind.slot]]
  name = "on_fail"
  when = "post"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "issue"
    type = "Issue"

    [[kind.slot.param]]
    name = "outcome"
    type = "afkd.Outcome"

  [[kind.slot]]
  name = "on_park"
  when = "post"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "issue"
    type = "Issue"

    [[kind.slot.param]]
    name = "outcome"
    type = "afkd.Outcome"

# The pull-request kind, `service(gitea.pr)` in a config: the review loop over a
# repository's (or an org's) pull requests. It has `author_me` in place of `source_label`
# and `discuss_with`, and never parks.
[[kind]]
name = "pr"
role = "trigger"
claims = true

  [[kind.setting]]
  name = "base_url"
  type = "string"

  [[kind.setting]]
  name = "repo"
  type = "string"

  [[kind.setting]]
  name = "org"
  type = "string"

  [[kind.setting]]
  name = "token"
  type = "string"
  required = true

  [[kind.setting]]
  name = "author_me"
  type = "bool"
  default = false

  # These three afkd reads itself, as it declares them for every claiming kind.
  [[kind.setting]]
  name = "follow_comments"
  type = "duration"
  jitter = true

  [[kind.setting]]
  name = "max_attempts"
  type = "int"
  default = 1

  [[kind.setting]]
  name = "poll_interval"
  type = "duration"
  jitter = true
  default = "30s"

  # The slots afkd runs, each passed the run and its pull request, and after the run its
  # outcome; each action a slot calls is one `call` to this plugin.
  [[kind.slot]]
  name = "on_run"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "pr"
    type = "Pull_Request"

  [[kind.slot]]
  name = "on_claim"
  when = "pre"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "pr"
    type = "Pull_Request"

  [[kind.slot]]
  name = "on_done"
  when = "post"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "pr"
    type = "Pull_Request"

    [[kind.slot.param]]
    name = "outcome"
    type = "afkd.Outcome"

  [[kind.slot]]
  name = "on_fail"
  when = "post"

    [[kind.slot.param]]
    name = "run"
    type = "afkd.Run"

    [[kind.slot.param]]
    name = "pr"
    type = "Pull_Request"

    [[kind.slot.param]]
    name = "outcome"
    type = "afkd.Outcome"

# The actions a slot of the issue kind calls, each on the issue it is passed first.
[[action]]
name = "assign_me"

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

[[action]]
name = "unassign"

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

[[action]]
name = "label_add"

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "label"
  type = "string"
  required = true

[[action]]
name = "label_remove"

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "label"
  type = "string"
  required = true

[[action]]
name = "close"

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

[[action]]
name = "comment"

  [[action.param]]
  name = "issue"
  type = "Issue"
  required = true

  [[action.param]]
  name = "text"
  type = "string"
  required = true

# The same six for a slot of the pr kind, each on the pull request it is passed first: a
# config's types have no subtyping, so one action cannot take both kinds' items.
[[action]]
name = "pr_assign_me"

  [[action.param]]
  name = "pr"
  type = "Pull_Request"
  required = true

[[action]]
name = "pr_unassign"

  [[action.param]]
  name = "pr"
  type = "Pull_Request"
  required = true

[[action]]
name = "pr_label_add"

  [[action.param]]
  name = "pr"
  type = "Pull_Request"
  required = true

  [[action.param]]
  name = "label"
  type = "string"
  required = true

[[action]]
name = "pr_label_remove"

  [[action.param]]
  name = "pr"
  type = "Pull_Request"
  required = true

  [[action.param]]
  name = "label"
  type = "string"
  required = true

[[action]]
name = "pr_close"

  [[action.param]]
  name = "pr"
  type = "Pull_Request"
  required = true

[[action]]
name = "pr_comment"

  [[action.param]]
  name = "pr"
  type = "Pull_Request"
  required = true

  [[action.param]]
  name = "text"
  type = "string"
  required = true

# `gitea.me`: the login the token authenticates as, for a slot's comment or label.
[[value]]
name = "me"
type = "string"
